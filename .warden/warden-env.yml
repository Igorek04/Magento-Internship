version: "3"
services:

  # Selenium Containers (MFTF)
  chrome:
    build:
      context: .
      dockerfile: .warden/docker/Dockerfile
    shm_size: 2gb
    extra_hosts:
      - ${TRAEFIK_DOMAIN}:${TRAEFIK_ADDRESS:-0.0.0.0}
      - ${TRAEFIK_SUBDOMAIN:-app}.${TRAEFIK_DOMAIN}:${TRAEFIK_ADDRESS:-0.0.0.0}
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "5900:5900"
  selenium-hub:
    image: selenium/hub:latest
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"
    environment:
      GRID_TIMEOUT: 0
      GRID_BROWSER_TIMEOUT: 0

# Matomo Analytics Containers
  matomo-db:
    image: mariadb:10.6
    container_name: matomo-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: matomo_root
      MYSQL_DATABASE: matomo
      MYSQL_USER: matomo
      MYSQL_PASSWORD: matomo_pass
    volumes:
      - matomo_db_data:/var/lib/mysql

  matomo:
    image: matomo:5-apache
    container_name: matomo-app
    restart: unless-stopped
    depends_on:
      - matomo-db
    labels:
      - traefik.enable=true
      - traefik.http.routers.matomo.rule=Host(`matomo.test`)
      - traefik.http.routers.matomo.tls=true
      - traefik.http.services.matomo.loadbalancer.server.port=80
    environment:
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: matomo_pass
      MATOMO_DATABASE_DBNAME: matomo
    volumes:
      - matomo_app_data:/var/www/html

volumes:
  matomo_db_data:
  matomo_app_data:
