<div class="component-wrapper">
    <div class="voting-expiry"
         style="font-size: 12px; color: #666; margin-bottom: 10px; text-align: center;"
         data-bind="text: expiryText">
    </div>

    <h2 data-bind="text: title"></h2>
    <p data-bind="text: description"></p>

    <!-- ko if: systemMessage -->
    <div class="voting-system-message"
         data-bind="text: systemMessage, css: { 'status-ok': messageStatus(), 'status-err': !messageStatus() }"
         style="padding: 10px; margin: 10px 0; border-radius: 5px; text-align: center;">
    </div>
    <!-- /ko -->

    <!-- ko foreach: options -->
    <div class="bar" data-bind="
            css: {
                selected: $parent.isSelected($data),
                disabled: $parent.isReadOnly()
                },
             click: function() { if (!$parent.isReadOnly()) $parent.selectOption($data); }
            ">
        <div class="progress"
             data-bind="style: { width: percent + '%' }">
        </div>
        <div class="percent"
             data-bind="text: percent + '%'">
        </div>
        <div class="text">
            <div class="option-layout">
                <!-- ko if: product -->
                <div class="option-image">
                    <img data-bind="attr: { src: product.image, alt: product.name }" />
                </div>
                <!-- /ko -->

                <div class="option-content">
                    <div class="option-title">
                        <span data-bind="text: title"></span>
                        <span class="votes"
                              data-bind="text: ' (' + votes + ' votes)'"></span>
                    </div>

                    <!-- ko if: product -->
                    <a class="product-name"
                         data-bind="text: product.name, attr: { href: product.url }, click: function(data, event) { event.stopPropagation(); return true;}">
                    </a>
                    <!-- /ko -->

                    <!-- ko if: description -->
                    <div class="option-description"
                         data-bind="text: description">
                    </div>
                    <!-- /ko -->
                </div>
            </div>
        </div>
    </div>
    <!-- /ko -->

    <div class="actions-toolbar">

        <button class="action primary"
                type="button"
                data-bind="
            click: sendVote,
            attr: { title: buttonText },
            disable: isButtonDisabled">
            <span data-bind="text: buttonText"></span>
        </button>
    </div>
</div>
