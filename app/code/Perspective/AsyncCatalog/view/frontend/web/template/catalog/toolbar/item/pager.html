<div class="pages">
    <strong class="label pages-label"><span data-bind="i18n: 'Page'"></span></strong>
    <ul class="items pages-items">

        <!-- ko ifnot: isFirstPage() -->
        <li class="item pages-item-previous">
            <a class="action previous" href="#" data-bind="click: previousPage, attr: {title: $t('Previous')}">
                <span class="label" data-bind="i18n: 'Page'"></span>
                <span data-bind="i18n: 'Previous'"></span>
            </a>
        </li>
        <!-- /ko -->

        <!-- ko foreach: getFramePages() -->
        <!-- ko if: type === 'page' -->
        <li class="item" data-bind="css: {'current': isCurrent}">
            <!-- ko if: isCurrent -->
            <strong class="page">
                <span class="label" data-bind="i18n: 'You are currently reading page'"></span>
                <span data-bind="text: number"></span>
            </strong>
            <!-- /ko -->
            <!-- ko ifnot: isCurrent -->
            <a href="#" class="page" data-bind="click: $parent.changePage.bind($parent, number)">
                <span class="label" data-bind="i18n: 'Page'"></span>
                <span data-bind="text: number"></span>
            </a>
            <!-- /ko -->
        </li>
        <!-- /ko -->

        <!-- ko if: type === 'jump' -->
        <li class="item">
            <span class="page">...</span>
        </li>
        <!-- /ko -->
        <!-- /ko -->

        <!-- ko ifnot: isLastPage() -->
        <li class="item pages-item-next">
            <a class="action next" href="#" data-bind="click: nextPage, attr: {title: $t('Next')}">
                <span class="label" data-bind="i18n: 'Page'"></span>
                <span data-bind="i18n: 'Next'"></span>
            </a>
        </li>
        <!-- /ko -->

    </ul>
</div>
