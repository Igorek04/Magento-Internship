<div class="toolbar-sorter sorter">
    <label class="sorter-label" for="sorter">
        <span data-bind="i18n: 'Sort By'"></span>
    </label>

    <select id="sorter" data-role="sorter" class="sorter-options" data-bind="
        options: catalogData.availableSortList(),
        optionsText: 'label',
        optionsValue: 'value',
        value: catalogData.currentSortField,
        event: { change: function() { changeSort(catalogData.currentSortField()) } }
    ">
    </select>

    <a href="#" class="action sorter-action" data-bind="
        attr: { title: $t(getSortDirectionTitle()) },
        css: getSortDirectionClass(),
        click: changeDirection
    ">
        <span data-bind="i18n: getSortDirectionTitle()"></span>
    </a>
</div>
