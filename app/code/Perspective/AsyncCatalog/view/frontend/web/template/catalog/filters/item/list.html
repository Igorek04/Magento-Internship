<!--ko foreach: { data: getAggregations(), as: 'aggregation' }-->
<div class="filter-options-item"
     data-bind="mageInit: {'collapsible': {'openedState': 'active', 'saveState': false}}">

    <div data-role="title" class="filter-options-title" role="tab" aria-level="3" tabindex="0">
        <span data-bind="text: aggregation.label"></span>
    </div>

    <div data-role="content" class="filter-options-content" role="tabpanel" style="display: none;">
        <ol class="items">
            <!--ko foreach: { data: aggregation.options, as: 'option' }-->
            <li class="item">
                <a href="#" data-bind="click: option.boundApplyFilter">
                    <span data-bind="text: option.label"></span>
                    <!--ko if: option.count-->
                    <span class="count">
                        <span data-bind="text: option.count"></span>
                    </span>
                    <!--/ko-->
                </a>
            </li>
            <!--/ko-->
        </ol>
    </div>
</div>
<!--/ko-->
