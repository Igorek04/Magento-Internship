<!-- ko if: catalogData.availableModes().length > 1 -->
<div class="modes">
    <strong class="modes-label" id="modes-label">View as</strong>

    <!-- ko foreach: catalogData.availableModes() -->

        <!-- ko if: code === $parent.catalogData.currentMode() -->
            <strong data-bind="attr: { title: label, class: 'modes-mode active mode-' + code }">
                <span data-bind="text: label"></span>
            </strong>
        <!-- /ko -->

        <!-- ko ifnot: code === $parent.catalogData.currentMode() -->
            <a href="#" class="modes-mode" data-bind="
                        attr: {
                            title: label,
                            class: 'modes-mode mode-' + code,
                            id: 'mode-' + code
                        },
                        click: function(d, e) { $parent.changeMode(code, e); }
                    ">
                <span data-bind="text: label"></span>
            </a>
        <!-- /ko -->

    <!-- /ko -->
</div>
<!-- /ko -->
