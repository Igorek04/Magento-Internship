<div class="product-reviews-summary short" data-bind="css: { 'no-rating': !rating_summary }">

    <div class="rating-summary">
        <span class="label"><span data-bind="i18n: 'Rating'"></span>:</span>
        <div class="rating-result" data-bind="attr: { title: rating_summary + '%' }">
            <span data-bind="style: { width: rating_summary + '%' }">
                <span><span data-bind="text: rating_summary"></span>%</span>
            </span>
        </div>
    </div>
    <div class="reviews-actions">
        <a class="action view" data-bind="attr: { href: url_key + '.html#reviews' }">
            <span data-bind="text: review_count">&nbsp;</span>

            <span data-bind="i18n: review_count == 1 ? 'Review' : 'Reviews'"></span>
        </a>
    </div>
</div>
