<div class="product actions product-item-actions">
    <div class="actions-primary">
        <!-- ko if: stock_status === 'IN_STOCK' -->
        <form data-role="tocart-form"
              method="post"
              data-bind="attr: {
                      'data-product-sku': sku,
                      'action': $parent.getAddToCartUrl(id)
                  }">

            <input type="hidden" name="product" data-bind="value: id">
            <input type="hidden" name="uenc" data-bind="value: $parent.getUenc()">
            <input type="hidden" name="form_key" data-bind="value: $parent.getFormKey()">

            <button type="submit"
                    title="Add to Cart"
                    class="action tocart primary">
                <span data-bind="i18n: 'Add to Cart'"></span>
            </button>
        </form>
        <!-- /ko -->

        <!-- ko if: stock_status !== 'IN_STOCK' -->
        <div class="stock unavailable">
            <span data-bind="i18n: 'Out of stock'"></span>
        </div>
        <!-- /ko -->
    </div>

    <div data-role="add-to-links" class="actions-secondary">
        <a href="#" class="action towishlist"
           data-bind="click: function() { $parent.addToWishlist(id) }">
            <span data-bind="i18n: 'Add to Wish List'"></span>
        </a>

        <a href="#"
           class="action tocompare"
           data-bind="click: function() { $parent.addToCompare(id) }">
            <span data-bind="i18n: 'Add to Compare'"></span>
        </a>
    </div>
</div>
