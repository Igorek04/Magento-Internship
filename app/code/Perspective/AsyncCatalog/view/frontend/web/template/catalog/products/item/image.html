<a data-bind="attr: {href: url_key + '.html'}" class="product photo product-item-photo" tabindex="-1">
    <span class="product-image-container" style="width: 240px; display: block;">
        <span class="product-image-wrapper" style="padding-bottom: 125%; display: block; position: relative; background: #f5f5f5;">
            <!-- ko if: $data.small_image -->
            <img class="product-image-photo"
                 data-bind="attr: {
                                src: small_image.url,
                                alt: name
                            }"
                 style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
                 width="240" height="300">
            <!-- /ko -->
        </span>
    </span>
</a>
