<a data-bind="attr: {href: url}" class="product photo product-item-photo" tabindex="-1">
    <span class="product-image-container" style="width: 240px; display: block;">
        <span class="product-image-wrapper">
            <!-- ko if: $data.small_image -->
            <img class="product-image-photo"
                 data-bind="attr: {
                                src: small_image.url,
                                alt: name
                            }"
            >
            <!-- /ko -->
        </span>
    </span>
</a>
